name: Publicar ActivAnatomy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Ativar mapa e leitor estável
        run: |
          sed -i "s#</body>#<script src=\"anatomy-map.js?v=${GITHUB_SHA}\"></script><script src=\"parser-fix.js?v=${GITHUB_SHA}\"></script></body>#" index.html
      - name: Preparar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
